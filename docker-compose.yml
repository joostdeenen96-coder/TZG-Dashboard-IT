services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: tzg-dashboard:local
    container_name: tzg-dashboard
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_ROOT: /app
      DATA_DIR: /app/data
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      PRTG_BASE_URL: ${PRTG_BASE_URL:-}
      PRTG_USERNAME: ${PRTG_USERNAME:-}
      PRTG_PASSHASH: ${PRTG_PASSHASH:-}
      PRTG_PASSWORD: ${PRTG_PASSWORD:-}
      PRTG_GROUP_ID: ${PRTG_GROUP_ID:-}
      PRTG_TAG: ${PRTG_TAG:-}
      PRTG_TLS_INSECURE: ${PRTG_TLS_INSECURE:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
