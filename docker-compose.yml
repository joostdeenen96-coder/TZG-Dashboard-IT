services:
  postgres:
    image: postgres:16-bookworm
    container_name: tzg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tzg}
      POSTGRES_USER: ${POSTGRES_USER:-tzg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
    volumes:
      - tzg-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tzg} -d ${POSTGRES_DB:-tzg}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    shm_size: 128mb

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.4.1}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    image: tzg-dashboard:local
    container_name: tzg-dashboard
    # Altijd bereikbaar voor nginx op het Docker-netwerk.
    expose:
      - "8080"
    # Host-publicatie 8080 (EXPOSE_INTERNAL_PORT=true, standaard).
    # Uitschakelen: zie docker-compose.expose-internal.off.yml en docs/HTTPS-SETUP.md.
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      APP_ROOT: /app
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://${POSTGRES_USER:-tzg}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tzg}
      DASHBOARD_REPOSITORY: postgres
      POSTGRES_DB: ${POSTGRES_DB:-tzg}
      POSTGRES_USER: ${POSTGRES_USER:-tzg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      SCREEN_HEARTBEAT_SECONDS: ${SCREEN_HEARTBEAT_SECONDS:-60}
      SCREEN_OFFLINE_AFTER_SECONDS: ${SCREEN_OFFLINE_AFTER_SECONDS:-180}
      SCREEN_HEARTBEAT_RETENTION_DAYS: ${SCREEN_HEARTBEAT_RETENTION_DAYS:-14}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIRECTORY: /backups
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-0.4.1}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_DATE: ${BUILD_DATE:-}
      # Standaard 1 hop: nginx → dashboard. Zet TRUST_PROXY=0 alleen zonder proxy.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      PRTG_BASE_URL: ${PRTG_BASE_URL:-}
      PRTG_USERNAME: ${PRTG_USERNAME:-}
      PRTG_PASSHASH: ${PRTG_PASSHASH:-}
      PRTG_PASSWORD: ${PRTG_PASSWORD:-}
      PRTG_GROUP_ID: ${PRTG_GROUP_ID:-}
      PRTG_TAG: ${PRTG_TAG:-}
      PRTG_TLS_INSECURE: ${PRTG_TLS_INSECURE:-}
      # Schepenplanning (Tarasa) — alleen server-side; nooit naar frontend.
      SHIP_PLANNING_BASE_URL: ${SHIP_PLANNING_BASE_URL:-https://planning.teunesen.nl}
      SHIP_PLANNING_USERNAME: ${SHIP_PLANNING_USERNAME:-}
      SHIP_PLANNING_PASSWORD: ${SHIP_PLANNING_PASSWORD:-}
      SHIP_PLANNING_TOTP_SECRET: ${SHIP_PLANNING_TOTP_SECRET:-}
      SHIP_PLANNING_API_KEY: ${SHIP_PLANNING_API_KEY:-}
    volumes:
      - ./data:/app/data
      - tzg-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: tzg-nginx:local
    container_name: tzg-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_CN: ${CERT_CN:-nc.teunesen.nl}
      CERT_DAYS: ${CERT_DAYS:-3650}
      CERT_DIR: /etc/nginx/certs
    volumes:
      - tzg-certs:/etc/nginx/certs
      - tzg-acme-www:/var/www/certbot
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup:
    image: postgres:16-bookworm
    container_name: tzg-backup
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-tzg}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ontbreekt}
      PGDATABASE: ${POSTGRES_DB:-tzg}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIRECTORY: /backups
    volumes:
      - tzg-backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    init: true
    read_only: true
    tmpfs:
      - /tmp
    command: ["bash", "/backup-loop.sh"]

volumes:
  tzg-postgres:
  tzg-backups:
  tzg-certs:
  tzg-acme-www:
